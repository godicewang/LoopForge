name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: swift --version
      - name: Tests
        run: swift test
      - name: Release build with warnings as errors
        run: swift build -c release -Xswiftc -warnings-as-errors
      - name: Discovery metadata
        run: zsh Scripts/validate_discovery.sh
